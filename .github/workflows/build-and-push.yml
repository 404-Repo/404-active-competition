name: Copy closed-source model submissions to R2

on:
  push:
    paths:
      - '**/submissions.json'
  workflow_dispatch:
    inputs:
      round:
        description: 'Round number to copy (for example, 57)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      submission_file: ${{ steps.find-submissions.outputs.file }}
      has_submissions: ${{ steps.set-matrix.outputs.has_submissions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Get changed submissions file
        id: find-submissions
        env:
          INPUT_ROUND: ${{ inputs.round }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$INPUT_ROUND" =~ ^(0|[1-9][0-9]*)$ ]] || exit 1
            CHANGED_FILE="rounds/$INPUT_ROUND/submissions.json"
          else
            CHANGED_FILE=$(git diff --name-only HEAD~1 HEAD -- '**/submissions.json' | head -1 || true)
            if [ -z "$CHANGED_FILE" ]; then
              CHANGED_FILE=$(find rounds -maxdepth 2 -name 'submissions.json' | sort -V | tail -1)
            fi
          fi
          [[ "$CHANGED_FILE" =~ ^rounds/(0|[1-9][0-9]*)/submissions\.json$ ]] || exit 1
          test -f "$CHANGED_FILE"
          printf 'file=%s\n' "$CHANGED_FILE" >> "$GITHUB_OUTPUT"
      - name: Set matrix
        id: set-matrix
        env:
          SUBMISSION_FILE: ${{ steps.find-submissions.outputs.file }}
        run: |
          MATRIX=$(jq -ce 'if type == "object" and all(keys[]; test("^[1-9A-HJ-NP-Za-km-z]{48}$")) then keys else error("Invalid submissions object or hotkey") end' "$SUBMISSION_FILE")
          printf 'matrix=%s\n' "$MATRIX" >> "$GITHUB_OUTPUT"
          printf 'has_submissions=%s\n' "$(jq 'length > 0' <<< "$MATRIX")" >> "$GITHUB_OUTPUT"

  copy-source:
    name: Copy source to R2 / ${{ matrix.repo }}
    runs-on: arc-x86
    timeout-minutes: 135
    needs: setup
    if: needs.setup.outputs.has_submissions == 'true'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        repo: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MINER_GITHUB_TOKEN || github.token }}
          persist-credentials: false
      - name: Get repository info
        id: get-repo-info
        env:
          SUBMISSION_FILE: ${{ needs.setup.outputs.submission_file }}
          MINER_HOTKEY: ${{ matrix.repo }}
        run: |
          REPO_INFO=$(jq -ce --arg hotkey "$MINER_HOTKEY" '.[$hotkey] | select(type == "object") | select(.repo | strings | test("^[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+$")) | select(.repo | split("/")[1] | . != "." and . != "..") | select(.commit | strings | test("^[0-9a-f]{40}$")) | select(.round | type == "string")' "$SUBMISSION_FILE")
          printf 'repo-info=%s\n' "$REPO_INFO" >> "$GITHUB_OUTPUT"
      - name: Clone repository
        uses: actions/checkout@v4
        continue-on-error: true
        id: clone-repo
        with:
          repository: ${{ fromJson(steps.get-repo-info.outputs.repo-info).repo }}
          ref: ${{ fromJson(steps.get-repo-info.outputs.repo-info).commit }}
          path: ${{ matrix.repo }}
          token: ${{ secrets.MINER_GITHUB_TOKEN }}
          persist-credentials: false
      - name: Fallback clone with GITHUB_TOKEN
        if: steps.clone-repo.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: ${{ fromJson(steps.get-repo-info.outputs.repo-info).repo }}
          ref: ${{ fromJson(steps.get-repo-info.outputs.repo-info).commit }}
          path: ${{ matrix.repo }}
          token: ${{ github.token }}
          persist-credentials: false
      - name: Archive and upload to R2
        env:
          MINER_HOTKEY: ${{ matrix.repo }}
          SUBMISSION_FILE: ${{ needs.setup.outputs.submission_file }}
          REPOSITORY: ${{ fromJson(steps.get-repo-info.outputs.repo-info).repo }}
          COMMIT_SHA: ${{ fromJson(steps.get-repo-info.outputs.repo-info).commit }}
          ROUND_NAME: ${{ fromJson(steps.get-repo-info.outputs.repo-info).round }}
          REPO_R2_ENDPOINT: ${{ secrets.REPO_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.REPO_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.REPO_R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          ROUND_NUMBER=$(basename "$(dirname "$SUBMISSION_FILE")")
          SOURCE_KEY="sources/v2/rounds/$ROUND_NUMBER/$MINER_HOTKEY/$REPOSITORY/$COMMIT_SHA/source.zip"
          MANIFEST_KEY="${SOURCE_KEY%source.zip}manifest.json"
          test "$(git -C "$MINER_HOTKEY" rev-parse HEAD)" = "$COMMIT_SHA"
          git -C "$MINER_HOTKEY" ls-tree -r "$COMMIT_SHA" | awk '$1 != "100644" && $1 != "100755" { exit 1 }'
          # Override archive attributes so committed support files are not omitted or substituted.
          mkdir -p "$MINER_HOTKEY/.git/info"
          printf '* -export-ignore -export-subst\n' > "$MINER_HOTKEY/.git/info/attributes"
          git -C "$MINER_HOTKEY" archive --format=zip "$COMMIT_SHA" > source.zip
          SOURCE_SHA256=$(sha256sum source.zip | cut -d ' ' -f1)
          GIT_TREE=$(git -C "$MINER_HOTKEY" rev-parse 'HEAD^{tree}')
          jq -n --argjson round_number "$ROUND_NUMBER" --arg round "$ROUND_NAME" \
            --arg hotkey "$MINER_HOTKEY" --arg repo "$REPOSITORY" --arg commit "$COMMIT_SHA" \
            --arg git_tree "$GIT_TREE" --arg key "$SOURCE_KEY" --arg sha256 "$SOURCE_SHA256" \
            --argjson size_bytes "$(wc -c < source.zip)" \
            '{schema_version: 2, round_number: $round_number, round: $round, hotkey: $hotkey,
              repo: $repo, commit: $commit, git_tree: $git_tree, entrypoint: "main.py",
              source: {bucket: "miner-repo-archive", key: $key, sha256: $sha256, size_bytes: $size_bytes, format: "zip"}}' > manifest.json
          upload_once() {
            local file="$1" key="$2" content_type="$3"
            if ! aws s3api put-object --bucket miner-repo-archive --key "$key" --body "$file" \
              --content-type "$content_type" --if-none-match '*' --endpoint-url "$REPO_R2_ENDPOINT" > /dev/null; then
              printf 'Upload failed or object exists; verifying stored %s\n' "$key"
            fi
            aws s3api get-object --bucket miner-repo-archive --key "$key" \
              --endpoint-url "$REPO_R2_ENDPOINT" "$file.stored" > /dev/null
            if ! cmp -s "$file" "$file.stored"; then
              printf 'Stored object differs; refusing to overwrite %s\n' "$key" >&2
              exit 1
            fi
          }
          upload_once source.zip "$SOURCE_KEY" application/zip
          upload_once manifest.json "$MANIFEST_KEY" application/json
          printf 'source_key=%s\nmanifest_key=%s\nsha256=%s\n' "$SOURCE_KEY" "$MANIFEST_KEY" "$SOURCE_SHA256" >> "$GITHUB_OUTPUT"
        id: archive
      - name: Add to summary
        env:
          SOURCE_KEY: ${{ steps.archive.outputs.source_key }}
          MANIFEST_KEY: ${{ steps.archive.outputs.manifest_key }}
          SOURCE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          printf 'Copied source: `s3://miner-repo-archive/%s`\n\nManifest: `s3://miner-repo-archive/%s`\n\nZIP SHA-256: `%s`\n' "$SOURCE_KEY" "$MANIFEST_KEY" "$SOURCE_SHA256" >> "$GITHUB_STEP_SUMMARY"
